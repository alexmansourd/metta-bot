# Cloud Native Buildpacks project descriptor for Heroku Fir
# Docs: https://devcenter.heroku.com/articles/fir-runtime
#       https://buildpacks.io/docs/app-developer-guide/using-project-descriptor/

[project]
id = "ch.alexmansour.metta-bot"
name = "metta-bot"
version = "1.0.0"

[build]
# Keep the build context lean; these paths are not needed by buildpacks
exclude = [
  ".git",
  ".github",
  ".idea",
  "target",
  "build",
  "Dockerfile"
]

  # Use Heroku's Java buildpack (drives Maven automatically)
  [[build.buildpacks]]
  id = "heroku/java"

  # Ensure Procfile (worker) is honored under CNB/Fir
  [[build.buildpacks]]
  id = "heroku/procfile"

  # Match the Java version from pom.xml
  [[build.env]]
  name = "BP_JVM_VERSION"
  value = "11"

  # Speed up Maven build and match your Dockerfile behavior
  [[build.env]]
  name = "BP_MAVEN_BUILD_ARGUMENTS"
  value = "-DskipTests -B package"

# Notes:
# - Your existing Procfile defines a 'worker' process which will be used on Fir.
# - No changes to code are needed. Deploy on the Fir stack and the app will build
#   with the Java buildpack and run the worker process.
