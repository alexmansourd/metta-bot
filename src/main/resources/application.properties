# Telegram
telegram.bot.token=${TELEGRAMTOKEN}
telegram.bot.username=Metta-Bot
telegram.bot.userIdLuc=383970170
telegram.bot.userIdAlex=982237762
# Spring
spring.application.name=Metta-Bot
logging.level.root=INFO
# Database: PostgreSQL (Railway)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=2
# Hibernate JPA for PostgreSQL (Hibernate 6)
# Let Spring Boot auto-detect the dialect, or use the generic PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Adjust DDL strategy as needed: validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update
spring.main.web-application-type=none
# Reduce background threads
spring.task.scheduling.pool.size=1
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
spring.task.execution.pool.queue-capacity=100
# Lazy init beans to lower startup RSS
spring.main.lazy-initialization=true
# Disable JMX if not used
spring.jmx.enabled=false