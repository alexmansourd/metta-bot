# Spring
spring.application.name=Metta-Bot
logging.level.root=INFO
# Database: PostgreSQL (Railway)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=3
# Hibernate JPA for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
# Adjust DDL strategy as needed: validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update
spring.main.web-application-type=none